<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Roadmap</title>
  <link rel="stylesheet" href="css/variable.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar / Workspace Switcher -->
    <header class="app-header">
      <div class="workspace-switcher">
        <button class="ws-btn active" data-workspace="personal">
          <span class="icon-slot" data-icon="personal" aria-hidden="true"></span>
          Personal
        </button>
        <button class="ws-btn" data-workspace="work">
          <span class="icon-slot" data-icon="work" aria-hidden="true"></span>
          Work
        </button>
      </div>

      <div class="header-actions">
        <div class="view-controls">
          <button class="view-btn active" data-view="list">List</button>
          <button class="view-btn" data-view="board">Board</button>
          <button class="view-btn" data-view="calendar">Calendar</button>
        </div>
        <button id="open-task-dialog-btn" class="primary-btn">
          <span class="icon-slot" data-icon="plus" aria-hidden="true"></span>
          New Task
        </button>
      </div>
    </header>

    <h1 class="project-title" id="project-title">Personal Workspace</h1>

    <!-- Dynamic View Injected Here -->
    <main id="app-view"></main>
  </div>

  <!-- Native HTML5 Dialog for Adding Tasks -->
  <dialog id="task-dialog" class="task-modal">
    <form id="task-form" method="dialog">
      <h3>Create New Task</h3>

      <div class="form-group">
        <label for="task-title-input">Task Name</label>
        <input type="text" id="task-title-input" placeholder="e.g. Finish lecture notes" required autocomplete="off" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="task-status-select">Status</label>
          <select id="task-status-select">
            <option value="backlog">Backlog</option>
            <option value="in-progress">In Progress</option>
            <option value="ready-qa">Ready for Review</option>
          </select>
        </div>

        <div class="form-group">
          <label for="task-date-input">Due Date</label>
          <input type="date" id="task-date-input" required />
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="close-dialog-btn" class="secondary-btn">Cancel</button>
        <button type="submit" class="primary-btn">Save Task</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
